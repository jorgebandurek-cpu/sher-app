<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHER – אב־טיפוס</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
:root{--ink:#14232F;--mute:#5A6B78;--paper:#F2F5F5;--card:#fff;--line:#D9E1E4;--brand:#0E6B6B;--brandtxt:#fff;--sos:#C62F2F;--warn:#9A5B00;--warnbg:#FFF3DC;--ok:#1B7A43;--bar:#14232F;--bartxt:#fff;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E9F0F2;--mute:#9FB0BA;--paper:#0F1A22;--card:#18262F;--line:#2B3C47;--brand:#3FB8B8;--brandtxt:#06201F;--sos:#FF6B6B;--warn:#F2B35A;--warnbg:#3A2C10;--ok:#58C98A;--bar:#0A1218;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#shell{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.demo{background:var(--bar);color:var(--bartxt);padding:8px 14px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo b{font-weight:700}
.demo select{font:inherit;font-size:14px;min-height:36px;border-radius:8px;border:1px solid #5A6B78;background:#1f3341;color:#fff;padding:0 8px}
header.top{padding:14px 16px 6px}
header.top .org{font-size:13px;color:var(--mute)}
header.top h1{margin:2px 0 0;font-size:24px;font-weight:800;letter-spacing:0}
main{flex:1;padding:8px 16px 96px}
.sim{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{margin:0 0 6px;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mute{color:var(--mute);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:12px;border:0;font:inherit;font-weight:700;font-size:17px;background:var(--brand);color:var(--brandtxt);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sos{background:var(--sos);color:#fff}
a.btn{text-decoration:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:156px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:16px;line-height:1.25;padding:10px;text-align:center;cursor:pointer}
.tile svg{width:96px;height:96px;color:var(--ink)}
.tile img.pic{width:100px;height:100px;object-fit:contain;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile img.pic{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}}
.tile img.pic.col{mix-blend-mode:normal!important;filter:none!important}
.tile.sos{grid-column:1/-1;border-color:var(--sos);color:var(--sos);min-height:112px}
.tpill{position:relative;display:inline-flex;align-items:center;justify-content:center;width:76px;height:32px;font-size:13px;font-weight:700;color:var(--ok)}
.tpill svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke-width:2.5}
.tpill .trk{stroke:var(--line)}
.tpill .prg{stroke:var(--ok);stroke-dasharray:100;stroke-dashoffset:100;animation:ring 3s linear forwards}
@keyframes ring{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.idcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:0 14px 14px;margin:10px 0;overflow:hidden}
.idh{display:flex;justify-content:space-between;background:var(--brand);color:var(--brandtxt);margin:0 -14px 12px;padding:10px 14px;font-weight:800}
.idn{font-size:22px;font-weight:800;margin-bottom:8px}
.idr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.idr span{color:var(--mute);font-size:14px}
#alert,#note{position:fixed;inset:0;z-index:50;background:rgba(10,18,24,.78);display:flex;align-items:center;justify-content:center;padding:16px}
#alert .abox,#note .abox{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:18px;border:3px solid var(--sos);padding:16px;animation:apulse 1.2s ease-in-out infinite}
#alert .ahead,#note .ahead{color:var(--sos);font-weight:800;font-size:20px}
#alert .acat,#note .acat{font-size:26px;font-weight:800;margin:4px 0}
#alert .atxt,#note .atxt{font-size:19px;margin-bottom:6px}
#alert .abtns,#note .abtns{display:grid;gap:8px;margin-top:12px}
@keyframes apulse{0%,100%{box-shadow:0 0 0 0 rgba(198,47,47,.55)}50%{box-shadow:0 0 0 12px rgba(198,47,47,0)}}
@media (prefers-reduced-motion:reduce){#alert .abox{animation:none}}
#note{z-index:60}.btn.blue{background:#1d5fd8;color:#fff}.btn.red{background:var(--sos);color:#fff}.qa{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:50%;background:var(--card);border:2px solid var(--brand);font-size:22px;text-decoration:none;vertical-align:middle;margin-inline-start:6px}.hc{background:rgba(29,95,216,.1);border-radius:12px;padding:10px;margin:8px 0}
.tile:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn:focus-visible,.nav button:focus-visible,.opt:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.help{min-height:92px;font-size:24px;font-weight:800;border-radius:18px;flex-direction:column;gap:2px}
.help small{font-size:14px;font-weight:500;opacity:.9}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line);white-space:nowrap}
.pill.open{color:var(--warn);border-color:var(--warn)}
.pill.acc{color:var(--brand);border-color:var(--brand)}
.pill.esc{color:var(--sos);border-color:var(--sos)}
.pill.done{color:var(--ok);border-color:var(--ok)}
.req{border-inline-start:5px solid var(--line);padding-inline-start:12px}
.req.hi{border-inline-start-color:var(--sos)}
.req.md{border-inline-start-color:var(--warn)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:58px;margin:8px 0;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-align:start}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}.chip[aria-pressed=true]{border-color:var(--brand);background:var(--brand);color:var(--brandtxt)}
.opt[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
label{display:block;font-weight:700;margin:14px 0 6px}
textarea,select.f{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);min-height:52px}
.notice{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px;font-size:14px;margin:10px 0}
.nav{position:fixed;bottom:0;inset-inline:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;min-height:60px;background:none;border:0;font:inherit;font-size:13px;font-weight:500;color:var(--mute);cursor:pointer}
.nav button[aria-current=page]{color:var(--brand);font-weight:800;box-shadow:inset 0 3px 0 var(--brand)}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
dl{margin:0}dt{font-size:13px;color:var(--mute)}dd{margin:0 0 10px;font-weight:500}
.tl{list-style:none;margin:0;padding:0}.tl li{border-inline-start:2px solid var(--line);padding:0 12px 12px;margin-inline-start:6px}.tl small{display:block;color:var(--mute)}
.msg{background:var(--paper);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px}.msg b{font-size:13px;color:var(--mute);display:block}
input.f{width:100%;font:inherit;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);color:var(--ink)}
.chat input{flex:1;min-width:0;font:inherit;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="gW" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#E4E9EC"/><stop offset="1" stop-color="#B7C2C8"/></radialGradient><radialGradient id="gY" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFE866"/><stop offset=".6" stop-color="#F4B90A"/><stop offset="1" stop-color="#C98E00"/></radialGradient><radialGradient id="gO" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFB85C"/><stop offset=".6" stop-color="#F58A1F"/><stop offset="1" stop-color="#D9650A"/></radialGradient><radialGradient id="gR" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FF8272"/><stop offset=".6" stop-color="#D93C2F"/><stop offset="1" stop-color="#A52519"/></radialGradient><radialGradient id="gB" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#86BCE0"/><stop offset=".6" stop-color="#3F7FAA"/><stop offset="1" stop-color="#2B5F83"/></radialGradient></defs></svg>
<div id="shell">
  <div class="demo">
    <b>הדגמה</b><span>לא אימות אמיתי</span><span id="sync" class="sim">מקומי</span>
    <select id="selOrg" aria-label="ארגון"></select>
    <select id="selRole" aria-label="תפקיד"></select>
  </div>
  <header class="top"><div class="org" id="orgName"></div><h1 id="title"></h1></header>
  <main id="app"></main>
  <nav class="nav" id="nav" aria-label="ניווט ראשי"></nav>
</div>
<script>
const ORGS={
 o1:{name:"אלון הובלות בע״מ",users:{employee:"דנה כהן (עובדת)",employee2:"שירה מזרחי (עובדת)",team:"יוסי לוי (מנהל צוות)",org:"מיכל אברהם (מנהלת ארגון)"},
  reqs:[
   {id:1,cat:"vehicle",txt:"תקר בצמיג, חסר ג׳ק",dist:"0.4 ק״מ",pri:"md",st:"open",who:"רון ביטון",t:"לפני 6 דקות"},
   {id:2,cat:"manpower",txt:"נדרש עובד נוסף להעמסה",dist:"1.1 ק״מ",pri:"md",st:"acc",who:"שירה מזרחי",t:"לפני 22 דקות"},
   {id:3,cat:"tools",txt:"חסר מקדחה, אין מענה",dist:"2.3 ק״מ",pri:"hi",st:"esc",who:"אבי דהן",t:"לפני 41 דקות"},
   {id:4,cat:"general",txt:"עזרה בפתיחת שער",dist:"0.9 ק״מ",pri:"lo",st:"done",who:"נועה פרץ",t:"אתמול"}]},
 o2:{name:"נחשול תקשורת",users:{employee:"עומר גולן (עובד)",employee2:"תומר אילן (עובד)",team:"ליאת שרון (מנהלת צוות)",org:"גיל נחום (מנהל ארגון)"},
  reqs:[
   {id:11,cat:"professional",txt:"נדרש טכנאי כבלים לייעוץ",dist:"0.7 ק״מ",pri:"lo",st:"open",who:"תומר אילן",t:"לפני 12 דקות"},
   {id:12,cat:"injury",txt:"פגיעה קלה בעבודה בגובה",dist:"1.3 ק״מ",pri:"hi",st:"acc",who:"הדס רז",t:"לפני 30 דקות"},
   {id:13,cat:"vehicle",txt:"רכב לא מתניע",dist:"1.0 ק״מ",pri:"md",st:"done",who:"עדי קורן",t:"אתמול"}]}
};
const CATS={emergency:"חירום",safety:"אירוע בטיחות",injury:"פציעה",vehicle:"תקלה ברכב",tools:"כלים וציוד",professional:"סיוע מקצועי",manpower:"כוח אדם נוסף",general:"סיוע כללי"};
const ST={can:["בוטלה","done"],enr:["בדרך","acc"],prog:["טיפול במקום","acc"],res:["נפתרה","done"],open:["פתוחה","open"],acc:["התקבלה לטיפול","acc"],esc:["הוסלמה למנהל","esc"],done:["נסגרה","done"]};
const ROLES={employee:"עובד",team:"מנהל צוות",org:"מנהל ארגון"};
const S={org:"o1",role:"employee",tab:"new",shift:false,step:0,cat:null,desc:"",online:true,sent:null,ev:null,toast:"",onb:1,err:"",nm:"",mg:"",prof:null,edit:false,draft:null,fromSettings:false,eid:"",code:"",orgIn:"",ph:"",div:"",li:"gps",rem:false,np:{req:true,status:true,chat:true}};
const $=s=>document.querySelector(s);
const org=()=>ORGS[S.org];
const mgr=()=>S.role==="team"||S.role==="org";
const pill=r=>r.pending?'<span class="pill open">ממתינה לשליחה</span>':`<span class="pill ${ST[r.st][1]}">${ST[r.st][0]}</span>`;
function reqCard(r){
 return `<div class="card req ${r.pri}" role="button" tabindex="0" onclick="openEv(${r.id})"><div class="row"><b>${CATS[r.cat]}</b>${pill(r)}</div>
 <div>${r.txt}</div><div class="mute">${r.who} · ${tm(r.t)} · ${r.dist} <span class="sim">מרחק מדומה</span></div></div>`;
}
function home(){
 const rs=org().reqs, open=rs.filter(r=>r.st==="open"), esc=rs.filter(r=>r.st==="esc"), done=rs.filter(r=>r.st==="done");
 if(mgr()) return `<div class="stat"><div><b>${open.length}</b>פתוחות</div><div><b>${esc.length}</b>הוסלמו</div><div><b>${done.length}</b>נסגרו</div></div>
 <div class="card"><h2>דורשות טיפול</h2>${[...esc,...open].map(reqCard).join("")||'<div class="empty">אין בקשות פתוחות</div>'}</div>
 <p class="mute">אין מפת עובדים קבועה. מיקום משמש רק לאירוע פעיל.</p>`;
 return `<div class="card"><div class="row"><div><h2>התראות</h2><div class="mute">פעילות גם כשהאפליקציה סגורה <span class="sim">הדמיה</span></div></div>
 </div>
 <div class="mute" style="margin-top:8px">מיקום: משמש רק בזמן אירוע (מדומה) <span class="sim">הדמיה</span></div></div>
 <button class="btn help" onclick="go('new')" >בקשת עזרה<small>לחיצה אחת, שלושה שלבים</small></button>
 ${S.sent?`<div class="card" role="button" tabindex="0" onclick="openEv(${S.sent.id})"><h2>הבקשה שלי</h2><div class="row"><b>${CATS[S.sent.cat]}</b>${pill(org().reqs.find(x=>x.id===S.sent.id)||{st:"open"})}</div><div class="mute">${S.sent.desc||"ללא תיאור"}</div></div>`:""}
 <div class="card"><h2>בקשות קרובות אליי</h2>${[...open,...esc].map(reqCard).join("")}</div>
 <div class="notice"><b>חירום:</b> SHER אינה מחליפה שירותי חירום. במצב סכנה חיים חייגו 101 (מד״א), 100 (משטרה) או 102 (כב״ה).</div>`;
}
function nearby(){
 const l=org().reqs.filter(r=>r.st!=="done");
 return `<div class="notice">התאמה, מרחקים והתראות הם הדמיה. אין כאן איתור GPS אמיתי. רדיוס התחלתי בייצור: 1.5 ק״מ.</div>`+
 (l.map(reqCard).join("")||'<div class="empty">אין בקשות פעילות באזורך</div>');
}
function history(){
 return `<div class="card"><h2>היסטוריית אירועים</h2>${org().reqs.map(reqCard).join("")}</div>`;
}
function settings(){
 return idCard()+(mgr()?`<div class="card"><h2>עובדים והזמנות (דוגמה)</h2>${Object.values(org().users).map(u=>`<div style="padding:6px 0">${u}</div>`).join("")}<div class="mute">הזמנה ממתינה: 1234 (דוגמה)</div></div>`:"")+`<div class="card"><dl><dt>תפקיד (הדגמה)</dt><dd>${ROLES[S.role]}</dd>
 <dt>התראות</dt><dd>פעילות גם כשהאפליקציה סגורה (הדמיה)</dd><dt>שיתוף מיקום</dt><dd>רק בזמן אירוע (מדומה)</dd></dl></div>
 <div class="card"><h2>מצב רשת</h2><div class="row"><span>${S.online?"מחובר":"לא מחובר"}</span>
 <button class="btn alt" style="width:auto;padding:0 18px" onclick="toggleNet()">החלפה</button></div></div>
 <div class="card"><h2>התראות <span class="sim">בקרים מדומים</span></h2>${[["req","בקשות עזרה קרובות"],["status","עדכוני סטטוס באירועים שלי"],["chat","הודעות צ׳אט"]].map(([k,v])=>`<label class="row" style="margin:0;padding:8px 0;font-weight:500"><span>${v}</span><input type="checkbox" style="width:26px;height:26px" ${S.np[k]?"checked":""} onchange="S.np.${k}=this.checked"></label>`).join("")}<label class="row" style="margin:0;padding:8px 0;font-weight:500"><span>התראות חירום (תמיד פעילות)</span><input type="checkbox" style="width:26px;height:26px" checked disabled></label><button class="btn alt" style="margin:8px 0" onclick="showAlert(SAMPLE_ALERT())">הדגמת התראה נכנסת</button><div class="mute">הבחירות נשמרות רק בזיכרון הדף ואינן משפיעות על התראות אמיתיות.</div></div>
<div class="card"><h2>שימוש במיקום</h2><div class="mute">המיקום משמש רק לאיתור עמיתים זמינים בקרבת אירוע. אין מעקב רציף. מדיניות שמירה לדוגמה: מחיקה אחרי 30 יום.</div></div>
 <button class="btn alt" onclick="resetAll()">איפוס נתוני הדמיה משותפים (לכולם)</button><div class="notice">מדומה בגרסה זו: התחברות, הרשאות, מיקום, התראות, צ׳אט. אין להשתמש באב־טיפוס לאירועים אמיתיים.</div>`;
}
function newReq(){
 if(S.step===0)return tiles();if(S.step===-1) return `<h2>מה קרה?</h2>`+Object.entries(CATS).map(([k,v])=>`<button class="opt" aria-pressed="${S.cat===k}" onclick="S.cat='${k}';S.step=1;draw()">${v}<span class="mute">‹</span></button>`).join("");
 if(S.step===1) return `<div class="card"><b>${CATS[S.cat]}</b></div>
 <label for="d">תיאור קצר</label><textarea id="d" rows="3" oninput="S.desc=this.value">${S.desc}</textarea>
 <label>לכמה זמן צריך?</label><div class="chips">${DURS.map(d=>`<button class="chip" aria-pressed="${S.dur===d[0]}" onclick="S.dur='${d[0]}';draw()">${d[1]}</button>`).join("")}</div>
 <div style="height:14px"></div><button class="btn" onclick="submitReq()">שלח בקשה</button>`;
 const sos=["emergency","safety","injury"].includes(S.cat);
 return `<div class="card"><h2>אישור שליחה</h2><dl><dt>סוג</dt><dd>${CATS[S.cat]}</dd><dt>תיאור</dt><dd>${S.desc||"ללא תיאור"}</dd><dt>מיקום</dt><dd>${curLoc().n}</dd></dl></div>
 ${sos?'<div class="notice">במצב סכנת חיים חייגו קודם 101 / 100 / 102. ההתראות כאן הן הדמיה בלבד ולא נשלחו לאף אחד.</div>':""}
 <button class="btn ${sos?"sos":""}" onclick="submitReq()">שליחת בקשה (הדמיה)</button>
 <div style="height:10px"></div><button class="btn alt" onclick="S.step=1;draw()">חזרה</button>`;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ring(){try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}beep3()}
function closeAlert(){ALERT=null;clearInterval(window._ar);const el=$("#alert");if(el)el.remove()}
async function alertAccept(){const a=ALERT;if(!a)return;if(a.sample){closeAlert();return}clearInterval(window._ar);S.ev=a.id;S.tab="event";S.toast="";await act("acc");const r=ORGS[S.org].reqs.find(x=>x.id===a.id);if(r&&r.st==="acc"&&r.hdid===DID){a.acc=true;showAccepted()}else{closeAlert();go("event")}}
const NOTE={};
function checkAlerts(o,rs){const first=!INIT[o];INIT[o]=true;
rs.forEach(r=>{const rev=r.rev||0,k=r.id+":"+rev,known=SEEN.has(k);SEEN.add(k);
if(o===S.org&&S.onb>=3&&mine(r)){const pv=NOTE[r.id];NOTE[r.id]={st:r.st,rev,h:r.hdid||""};if(pv){if(r.st==="acc"&&r.hc&&(pv.st!=="acc"||pv.h!==(r.hdid||"")))showNote("✅ עזרה בדרך",hcHtml(r.hc));else if(r.st==="open"&&rev>pv.rev)showNote("⚠️ בוטלה העזרה","<div class=\"atxt\">מחפש עמית חדש…</div>")}return}
if(known)return;const age=Date.now()-(r.relAt||r.id);if(first&&age>180000)return;
if(o!==S.org||S.onb<3||mine(r)||r.st!=="open"||r.pending||age>600000)return;
if((r.relBy||[]).includes(DID))return;
if(r.cat!=="emergency"&&!S.np.req)return;if(ALERT&&!ALERT.sample)return;showAlert(r)});
if(ALERT&&!ALERT.sample&&!ALERT.acc){const c=rs.find(x=>x.id===ALERT.id);if(c&&c.st!=="open")closeAlert()}}
function merge(o,rs){checkAlerts(o,rs);const m=new Map(SEED[o].map(r=>[r.id,JSON.parse(JSON.stringify(r))])),x=[];rs.forEach(r=>m.has(r.id)?m.set(r.id,r):x.push(r));x.sort((a,b)=>b.id-a.id);ORGS[o].reqs=[...x,...m.values()];if(S.onb<3)return;const i=$("#m"),v=i?i.value:"",f=i&&document.activeElement===i;draw();const n=$("#m");if(v&&n){n.value=v;if(f)n.focus()}}
async function resetAll(){if(!DB){location.reload();return}try{for(const o of Object.keys(ORGS)){const s=await DB.collection("reqs-"+o).get();for(const d of s.docs)await DB.doc("reqs-"+o+"/"+d.id).delete()}const l=await DB.collection("locks").get();for(const d of l.docs)await DB.doc("locks/"+d.id).delete()}catch(e){}S.tab="home";S.toast="";draw()}
function toggleNet(){S.online=!S.online;if(S.online)Object.entries(ORGS).forEach(([k,o])=>o.reqs.forEach(r=>{if(r.pending){r.pending=false;r.tl.push([SYS,"החיבור חזר: הבקשה נשלחה (מדומה)",Date.now()]);sv(r,k)}}));draw()}
const BANNER='<div class="notice" role="status">אין חיבור (הדמיה). בקשות חדשות נשמרות במכשיר בלבד וממתינות לשליחה.</div>';
const NOWS="עכשיו";
function stampNew(){Object.values(ORGS).forEach(o=>o.reqs.forEach(r=>{if(r.t===NOWS)r.t=Date.now();(r.tl||[]).forEach(e=>{if(e[2]===NOWS)e[2]=Date.now()})}))}
function ago(t){const m=Math.floor((Date.now()-t)/60000);if(m<1)return"לפני פחות מדקה";if(m<60)return"לפני "+m+" דק׳";return"לפני "+Math.floor(m/60)+" שע׳"}
function tm(t){if(typeof t!=="number")return t;const c=new Date(t).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});return `${c} (<span class="ago" data-t="${t}">${ago(t)}</span>)`}
setInterval(()=>document.querySelectorAll(".ago").forEach(s=>s.textContent=ago(+s.dataset.t)),15000);
const SYS="מערכת (הדמיה)";
function ens(r){if(!r.tl){r.tl=[[r.who,"פתיחת בקשה",r.t]];if(r.st!=="open")r.tl.push([SYS,"סטטוס: "+ST[r.st][0],r.t]);r.msgs=[[r.who,"צריך עזרה, תודה"]];r.rad=1.5}if(!r.ph&&r.id<1e6)r.ph=PHS[r.id%PHS.length];if(!r.div&&r.id<1e6)r.div=DIVS[r.id%DIVS.length];if(!r.mg&&r.id<1e6)r.mg=org().users.team.split(" (")[0];if(!r.loc)r.loc=LOCS[r.id%LOCS.length];return r}
const cur=()=>ens(org().reqs.find(r=>r.id===S.ev));
const me=()=>S.nm.trim()?esc(S.nm.trim()):org().users[S.role].split(" (")[0];
function openEv(id){S.ev=id;S.toast="";go("event")}
function log(r,who,act,st){r.tl.push([who,act,"עכשיו"]);if(st)r.st=st}
function submitReq(){const id=Date.now(),sos=["emergency","safety","injury"].includes(S.cat);const r=ens({id,cat:S.cat,txt:esc(S.desc)||"ללא תיאור",dist:"0 ק״מ",pri:S.cat==="emergency"?"hi":"md",st:"open",who:me(),uid:UID,did:DID,dur:S.dur,ph:S.ph,div:S.div,mg:S.mg,co:org().name,loc:curLoc(),t:"עכשיו"});
if(!S.online){r.pending=true;r.tl.push([SYS,"ממתינה לשליחה: אין חיבור, הבקשה עוד לא התקבלה בשרת",NOWS])}else if(sos){r.tl.push([SYS,"התראה מדומה לעמיתים זמינים ב־1.5 ק״מ","עכשיו"]);r.tl.push([SYS,"התראה מדומה למנהל/מוקד במקביל","עכשיו"])}else r.tl.push([SYS,S.online?"הבקשה נשלחה (מדומה)":"ממתינה לשליחה: אין חיבור, לא התקבלה בשרת","עכשיו"]);
r.tl.push([SYS,"נוצרה הודעת התראה: טקסט, קישור וויז וקישור חיוג (הדמיה)",NOWS]);org().reqs.unshift(r);sv(r);S.sent={cat:S.cat,desc:S.desc,id};S.cat=null;S.desc="";S.ev=id;S.toast="";go("event")}
async function act(k){if(k==="acc"&&DB){try{const l=await DB.doc("locks/"+cur().id+"_"+(cur().rev||0)).acquire({holder:UID||me(),ttlMs:3600000});if(!l.acquired){S.toast="הבקשה כבר נקלטה על ידי עמית אחר. הנעילה בוצעה בשרת.";draw();return}}catch(e){}}const r=cur(),m={acc:["קיבל/ה את הבקשה","acc"],enr:["בדרך למקום","enr"],prog:["הגיע/ה, טיפול במקום","prog"],res:["סימן/ה כנפתר","res"],cancel:["ביטל/ה את הבקשה","can"],close:["סגר/ה את האירוע","done"]}[k];if(k==="acc"){r.helper=me();r.hdid=DID;const P=S.prof||{};r.hc={nm:me(),co:org().name,un:S.div||P.unit||"",ph:S.ph||P.ph||"",mg:S.mg||""}}log(r,me(),m[0],m[1]);S.toast="";sv(r);if(k==="cancel"&&mine(r)&&!mgr()){const cid=r.id;S.cancelId=cid;S.cancelAt=Date.now();setTimeout(()=>{if(S.cancelId===cid){S.cancelId=null;if(S.tab==="event"&&S.ev===cid){S.sent=null;go("new")}}},3000)}draw()}
function race(){const r=cur();r.helper="אבי דהן";log(r,"אבי דהן","קיבל את הבקשה (ראשון)","acc");r.tl.push(["שרה לוי","ניסיון קבלה נדחה: הבקשה כבר בטיפול","עכשיו"]);S.toast="העמית השני נדחה. בייצור הנעילה תתבצע בשרת בפעולה אטומית אחת.";draw()}
function noResp(){const r=cur();if(r.rad<3){r.rad=3;r.tl.push([SYS,"אין מענה: הרדיוס הורחב ל־3 ק״מ","עכשיו"]);S.toast="לחיצה נוספת תסלים למנהל."}else{log(r,SYS,"הסלמה למנהל","esc");S.toast=""}draw()}
function send(){const i=$("#m");if(!i.value.trim())return;cur().msgs.push([me(),esc(i.value.trim()),Date.now()]);draw()}
const RP="M38 2H60A14 14 0 0 1 60 30H16A14 14 0 0 1 16 2H38";
function tpill(){const el=Math.max(0,Math.min(3,(Date.now()-S.cancelAt)/1000));return `<span class="tpill"><svg viewBox="0 0 76 32" aria-hidden="true"><path class="trk" d="${RP}"/><path class="prg" pathLength="100" d="${RP}" style="animation-delay:-${el.toFixed(2)}s"/></svg><span>בוטלה</span></span>`}
function ownView(r){const can=r.st==="open"||r.st==="acc",tp=r.st==="can"&&S.cancelId===r.id;
return `<div class="card req ${r.pri}"><div class="row"><b>${CATS[r.cat]}</b>${tp?tpill():pill(r)}</div><div>${r.txt}</div><div class="mute">${r.dur?"⏱ "+(DURL[r.dur]||"")+" · ":""}${tm(r.t)}${r.helper?" · מטפל/ת: "+r.helper:""}</div>${r.hc&&r.st!=="can"?hcHtml(r.hc):""}</div>`+(can?`<button class="btn alt" onclick="act('cancel')">ביטול הבקשה</button>`:"")}
function eventView(){const r=cur(),emp=!mgr(),a=[];if(emp&&mine(r))return ownView(r);
const B=(t,f,c="")=>a.push(`<button class="btn ${c}" onclick="${f}">${t}</button>`);
if(r.st==="open"){if(emp&&!mine(r))B("אני מגיע/ה לעזור","act('acc')");}
if(emp&&mine(r)&&(r.st==="open"||r.st==="acc"))B("ביטול הבקשה","act('cancel')","alt");
if(r.st==="acc")B("יצאתי לדרך","act('enr')");
if(r.st==="enr")B("הגעתי למקום","act('prog')");
if(r.st==="prog")B("סימון כנפתר","act('res')");
if(r.st==="esc"&&!emp)B("שיוך לעמית (הדמיה)","act('acc')");
if((r.st==="res"||r.st==="esc")&&!emp)B("סגירת האירוע","act('close')","alt");
if(r.hdid===DID&&(r.st==="acc"||r.st==="enr"))B("ביטל הגעה","relEv()","red");
if(r.st==="res"&&emp)a.push('<div class="mute">ממתין לסגירה על ידי מורשה</div>');
return `<button class="btn alt" style="width:auto;padding:0 16px;min-height:44px" onclick="go('home')">‹ חזרה</button>
<div class="card req ${r.pri}"><div class="row"><b>${CATS[r.cat]}</b>${pill(r)}</div><div>${r.txt}</div><div class="mute">${r.who} · רדיוס חיפוש ${r.rad} ק״מ ${r.helper?"· מטפל/ת: "+r.helper:""} <span class="sim">הדמיה</span></div></div>
${det(r)}${r.cat==="emergency"?'<div class="notice">SHER אינה מחליפה שירותי חירום. חייגו 101 / 100 / 102. ההתראות כאן מדומות.</div>':""}
<div style="display:grid;gap:8px">${a.join("")}</div>`}
const TABS=[["new","בקשת עזרה"],["home","בית"],["nearby","קרוב אליי"],["history","היסטוריה"],["settings","הגדרות"]];
const TITLES={event:"פרטי אירוע",home:"בית",nearby:"בקשות קרובות",history:"היסטוריה",settings:"הגדרות והפרטיות",new:"בקשת עזרה"};
function go(t){S.tab=t;S.step=0;draw();scrollTo(0,0)}
function draw(){stampNew();if(S.onb<3){onboard();return}if(S.tab==="event"&&!org().reqs.some(r=>r.id===S.ev))S.tab="home";
 $("#orgName").textContent=org().name;
 $("#title").textContent=mgr()&&S.tab==="home"?"לוח בקרה":TITLES[S.tab];
 $("#app").innerHTML=(S.online?"":BANNER)+{home,nearby,history,settings,new:newReq,event:eventView}[S.tab]();
 $("#nav").innerHTML=TABS.map(([k,v])=>`<button ${S.tab===k?'aria-current="page"':""} onclick="go('${k}')">${v}</button>`).join("");
}
function fillSel(){
 $("#selOrg").innerHTML=Object.entries(ORGS).map(([k,o])=>`<option value="${k}" ${S.org===k?"selected":""}>${o.name}</option>`).join("");
 $("#selRole").innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${S.role===k?"selected":""}>${v}</option>`).join("");
}
$("#selOrg").onchange=e=>{S.org=e.target.value;S.sent=null;S.tab="home";draw()};
$("#selRole").onchange=e=>{S.role=e.target.value;S.tab="home";S.sent=null;draw()};
try{const p0=JSON.parse(localStorage.getItem("sher_profile")||"null");if(p0&&p0.nm&&ORGS[p0.co]){applyProf(p0);S.onb=3}}catch(e){}
fillSel();draw();
['race','noResp','send'].forEach(n=>{const f=window[n];window[n]=function(){f.apply(this,arguments);try{const r=cur();if(r)sv(r)}catch(e){}}});
(async()=>{try{if(typeof claude==="undefined"){$("#sync").textContent="מקומי: אין חיבור לפלטפורמה";return}const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);if(!d){$("#sync").textContent="מקומי: אין גישה למסד נתונים";return}DB=d;if(u){try{UID=String(await u.id())}catch(e){}}await loadRemoteProf();Object.keys(ORGS).forEach(o=>DB.collection("reqs-"+o).onSnapshot(s=>{const rs=[];s.docs.forEach(x=>{try{rs.push(JSON.parse(x.data().j))}catch(e){}});merge(o,rs)},e=>{$("#sync").textContent="שגיאה: "+((e&&e.code)||"?")}));const SIG={};const poll=()=>Object.keys(ORGS).forEach(o=>DB.collection("reqs-"+o).get().then(s=>{const rs=[];s.docs.forEach(x=>{try{rs.push(JSON.parse(x.data().j))}catch(e){}});const g=JSON.stringify(rs);if(SIG[o]!==g){SIG[o]=g;merge(o,rs)}}).catch(()=>{}));setInterval(()=>{if(!document.hidden)poll()},2500);document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});let w=null;try{w=u?await u.can("data.write"):null}catch(x){}$("#sync").textContent=w===false?"משותף (קריאה בלבד)":"משותף (חי)"}catch(e){$("#sync").textContent="מקומי: שגיאה"}})();
</script>
